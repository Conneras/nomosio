# Νομόσιο — ρυθμίσεις Supabase για τις edge functions.
#
# Όλες έχουν verify_jwt = false, ΣΚΟΠΙΜΑ, και όχι για να κρυφτεί κάποιο 401:
# το project τρέχει με τα νέα κλειδιά (sb_publishable_), που δεν είναι JWT, και η
# τεκμηρίωση της Supabase λέει ότι ο έλεγχος JWT της πλατφόρμας δεν τα καταλαβαίνει.
# - plus-checkout, plus-portal, plus-delete: ελέγχουν τον χρήστη μέσα στον κώδικα με
#   withSupabase({ auth: 'user' }), που επαληθεύει το token του στο JWKS του project.
# - plus-webhook: ελέγχει την υπογραφή της Stripe πριν διαβάσει οτιδήποτε.
# Λεπτομέρειες: docs/PLUS.md

project_id = "omtgsnfvcvmhosioscrw"

[functions.plus-checkout]
verify_jwt = false

[functions.plus-portal]
verify_jwt = false

[functions.plus-delete]
verify_jwt = false

[functions.plus-webhook]
verify_jwt = false
